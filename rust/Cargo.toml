[workspace]
resolver = "3"
members = [
    "crates/chur-core",
    "crates/chur-crypto",
    "crates/chur-format",
    "crates/chur-catalog",
    "crates/chur-media",
    "crates/chur-sync-protocol",
    "crates/chur-ffi",
    "crates/chur-jni",
    "crates/chur-cli",
    "vendor/hmac-0.13.0",
    "vendor/hkdf-0.13.0",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 requires 1.85 (resolver 3
# needs 1.84); the advisory locks on the vault descriptor and on a vault directory in
# progress use `std::fs::File::try_lock`, stable since 1.89, so 1.89 is the
# floor. Every member inherits it, which is also how clippy learns the MSRV
# and stops suggesting newer APIs.
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/Chur"

[workspace.dependencies]
# An intra-workspace dependency carries an explicit version as well as a path.
# A path with no version is a wildcard requirement, which `cargo deny` rejects
# under the `wildcards = "deny"` rule in deny.toml.
chur-core = { path = "crates/chur-core", version = "0.1.0" }
chur-crypto = { path = "crates/chur-crypto", version = "0.1.0" }
chur-format = { path = "crates/chur-format", version = "0.1.0" }
chur-catalog = { path = "crates/chur-catalog", version = "0.1.0" }
chur-media = { path = "crates/chur-media", version = "0.1.0" }
chur-ffi = { path = "crates/chur-ffi", version = "0.1.0" }
chur-sync-protocol = { path = "crates/chur-sync-protocol", version = "0.1.0" }

# Cryptography. Narrow, well-reviewed libraries only (DEPENDENCY_POLICY.md).
# `zeroize` makes argon2 wipe its initial hash and gives `Block` the trait the
# caller-owned, wiped block buffer needs. In chacha20poly1305 it wipes the key
# that each cipher instance holds when the instance is dropped.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Phase 3 operation signatures. Exact on first adoption; no hazmat, batch,
# serialization, key-file, or RNG feature enters the protocol build.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
# Phase 4 wraps one collection key with the frozen RFC 9180 profile. Exact on
# first adoption; no PQ, NIST-curve, AES, serialization, or KAT feature.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
# Phase 3 portable key agreement. Exact on first adoption; randomness stays in
# chur-crypto and persisted bytes use Chur's canonical codec.
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
getrandom = "0.4"
# The boot clock of the password-attempt delay, PASSWORD_PROFILE.md section 11.
# Already in the production graph through getrandom and cpufeatures; the
# direct edge adds no package.
libc = { version = "0.2", default-features = false }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# NFKD for recovery-phrase re-entry, which ADR-0029 requires. Data tables only,
# no unsafe, no build script, no transitive dependency.
unicode-normalization = { version = "0.1", default-features = false }

# The private catalog engine. ADR-0004 names SQLCipher accessed directly from
# Rust as the physical implementation, and CATALOG_SCHEMA_V1.md section 16.4
# requires the FTS5 module the same SQLite build already carries. Keep default
# features off to exclude the unused WebAssembly VFS from Chur's native builds.
# Target-only WebAssembly packages may still appear in Cargo.lock.
rusqlite = { version = "0.42", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
    "column_decltype",
    "limits",
] }

# The Android JNI adapter, ADR-0040. Its proc-macro build script checks rustc's version.
jni = { version = "0.22", default-features = false }


# Portable JPEG XL parser. Explicitly approved; see DEPENDENCY_POLICY.md.
jxl-bitstream = "=1.1.0"
jxl-oxide-common = "=1.0.0"
jxl-coding = "=1.0.1"
jxl-grid = "=0.6.2"
jxl-oxide = { version = "=0.12.6", default-features = false, features = ["moxcms"] }

# Errors and CLI.
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Tooling only. These never appear in a dependency of chur-crypto or
# chur-format: TEST_VECTORS.md section 2 makes manifest.json an index, not a
# canonical protocol encoding, so no serializer default can reach persisted
# bytes through them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64ct = { version = "1.8.3", features = ["alloc"] }
hex = "0.4"
# Property tests only, never a normal dependency. Without the default
# features, no process fork, timeout thread, or temp-file graph is added.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `all` is a lint group, so it needs a lower priority than the individual
# lints below it; at equal priority rustc cannot order the group against its
# members and refuses to compile.
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"

# Cryptographic primitives are optimized even in a debug build. Argon2id at the
# frozen 64 MiB floor of PASSWORD_PROFILE.md section 4 takes seconds per
# derivation when compiled without optimization, and an unlock runs two, so an
# unoptimized suite spends minutes inside the primitive. Optimizing only these
# packages keeps every Chur crate debuggable and changes no behaviour: the
# output of a derivation does not depend on the optimization level.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
overflow-checks = true
# FFI panic containment: every `chur_*` export wraps its body in catch_unwind and
# converts a panic into INTERNAL_FAILURE, which requires unwinding to be enabled.
# See docs/interop/FFI_CONTRACT.md section 11 and docs/adr/0016-freeze-the-v1-c-abi.md.
panic = "unwind"

# Local cleanup patches; provenance and scope are in rust/vendor/README.md.
[patch.crates-io]
hmac = { path = "vendor/hmac-0.13.0" }
hkdf = { path = "vendor/hkdf-0.13.0" }
digest = { path = "vendor/digest-0.11.3" }
