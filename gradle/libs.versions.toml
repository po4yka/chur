# The pinned toolchain and dependency set for the Gradle build.
#
# `DEVELOPMENT.md` requires exact versions rather than globally mutable
# defaults, and `DEPENDENCY_POLICY.md` requires lockfiles and deliberate
# upgrades. Every version here is exact; none is a range.

[versions]
camerax = "1.6.2"
filament = "1.77.3"
# Toolchain
jdk = "21"
kotlin = "2.4.21"
agp = "9.5.0"
composeMultiplatform = "1.12.2"
# Compose Multiplatform Material 3 ships on its own version line, not the
# release-train number above.
composeMaterial3 = "1.9.0"

# Android, frozen by ADR-0017: minSdk 29, targetSdk 37.
androidMinSdk = "29"
androidCompileSdk = "37"
androidTargetSdk = "37"

# The NDK that builds and strips the native libraries, pinned so a machine
# with a newer one installed cannot silently change the toolchain. AGP uses
# exactly this version for its own tasks, and the native build script
# resolves it from the same value.
ndk = "30.0.16248370"

# iOS, frozen by ADR-0017. The Rust link and the vendored C of ADR-0038 must
# agree on it, or the link fails on a symbol the older target does not provide.
iosDeploymentTarget = "18.0"

# Libraries
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"
androidxCoreKtx = "1.19.1"
androidxActivityCompose = "1.13.0"
androidxLifecycle = "2.11.0"
androidxBiometric = "1.1.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# `androidx.biometric` 1.1.0 asks for a fragment version whose `FragmentActivity`
# still overrides `startActivityForResult` and rejects a request code above 16
# bits. The Activity Result API generates exactly those, so every
# `rememberLauncherForActivityResult` launch — the photo picker included — throws
# `IllegalArgumentException` on an activity built from it. The override is gone
# from 1.3.0 onwards; this pins a current one rather than inheriting that.
androidxFragment = "1.9.1"
# Media3 plays the decrypted ranges a vault-backed data source hands it.
# MEDIA_PIPELINE.md section 1 puts codec work on the platform, and this is the
# platform's player on Android.
androidxMedia3 = "1.11.1"
# The system security patch line of `ANDROID.md` §25.1 and ADR-0059.
androidxSecurityState = "1.1.0"
androidTesseract = "4.9.0"
# Android-only source-backed chrome; iOS uses UIKit materials.
haze = "2.0.1"
markdownRenderer = "0.46.0"

[libraries]
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
haze-core = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-glass = { module = "dev.chrisbanes.haze:haze-glass", version.ref = "haze" }
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
filament-gltfio = { module = "com.google.android.filament:gltfio-android", version.ref = "filament" }
android-tesseract = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "androidTesseract" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidxMedia3" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "androidxMedia3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidxMedia3" }
androidx-security-state = { module = "androidx.security:security-state", version.ref = "androidxSecurityState" }

# Compose Multiplatform artifacts, named directly. The `compose.runtime` style
# of accessor is deprecated in 1.11.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 requires this plugin for a Kotlin Multiplatform module; the classic
# `com.android.library` plugin refuses to apply beside the multiplatform one.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
